name: Verify research and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-python:
    name: Native and Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.88.0
      - name: Rust checks and native build
        shell: bash
        run: |
          cargo +1.88.0 fmt --all -- --check
          cargo +1.88.0 test --locked --release
          cargo +1.88.0 clippy --locked --release --all-targets --all-features -- -D warnings
          cargo +1.88.0 build --locked --release
      - name: Install research package and build tools
        run: python -m pip install "numpy==2.2.6" "setuptools==84.0.0" "wheel==0.48.0" ./python
      - name: Install independent VTK reader
        if: matrix.python == '3.12'
        run: python -m pip install "vtk==9.5.2"
      - name: Python tests against the new native build
        env:
          EARTHFORGE_ENGINE: ${{ github.workspace }}/target/release/earthforge${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s python/tests -v
      - name: Build bundled release wheel
        if: matrix.python == '3.12'
        run: python scripts/build-research-wheel.py --release --out releases/wheels
      - name: Install bundled wheel and verify full workflow outside checkout
        if: matrix.python == '3.12'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          wheel = next((root / 'releases/wheels').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-index', '--no-deps', '--force-reinstall', str(wheel)], check=True)
          env = dict(os.environ)
          env.pop('EARTHFORGE_ENGINE', None)
          env.pop('PYTHONPATH', None)
          subprocess.run([sys.executable, str(root / 'examples/research/validate_workflow.py'), '--out', str(root / 'releases/research'), '--require-bundled', '--require-vtk'], cwd=os.environ['RUNNER_TEMP'], env=env, check=True)
      - name: Save verified wheel and research example
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-${{ runner.os }}
          path: |
            releases/wheels/*.whl
            releases/research/verification.json
            releases/research/model.npz
            releases/research/model.vti
            releases/research/model.vti.json
            releases/research/paired-shot.npz
          if-no-files-found: error
          retention-days: 30

  web:
    name: Browser tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust and Wasm target
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Use the verified Rust version
        run: rustup override set 1.88.0
      - run: npm ci
      - name: Build portable and SIMD app modules
        run: npm run build:pages
      - name: Wasm compiler checks
        run: cargo clippy --locked --release --target wasm32-unknown-unknown --all-features -- -D warnings
      - name: Browser and reference regression tests
        run: node --test --test-concurrency=2 tests/*.test.mjs
      - name: Package exact source build with license and notices
        run: npm run package:web -- --out releases/site
      - name: Save web release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-alpha
          path: releases/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Save Pages deployment artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: releases/site

  deploy:
    name: Publish verified alpha to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [native-python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the artifact checked in this run
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
